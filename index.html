<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinBot 💼</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent2: #0891b2;
    --accent-dim: rgba(37, 99, 235, 0.08);
    --text: #1e293b;
    --text-muted: #64748b;
    --bot-bubble: #f1f5f9;
    --user-bubble: #dbeafe;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-image: 
      radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(8, 145, 178, 0.05) 0px, transparent 50%);
  }

  @keyframes appEnter {
    from { opacity: 0; transform: translateY(30px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .chat-wrapper {
    width: 100%;
    max-width: 440px;
    height: 100%;
    max-height: 720px;
    height: 100dvh; /* Dynamic viewport height for mobile */
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    animation: appEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }

  @media (max-width: 480px) {
    body {
      align-items: flex-start;
      background: var(--surface);
    }
    .chat-wrapper {
      max-width: 100%;
      max-height: 100%;
      height: 100dvh;
      border: none;
      border-radius: 0;
    }
    .chat-header {
      padding: 6px 12px;
      border-radius: 0;
    }
    .bot-avatar {
      width: 30px;
      height: 30px;
      font-size: 16px;
    }
    .header-info h1 {
      font-size: 12px;
    }
    .header-info span {
      font-size: 10px;
    }
    .messages {
      padding: 12px 12px;
      gap: 6px;
    }
    .bubble {
      padding: 6px 10px;
      font-size: 12.5px;
    }
    .input-area {
      padding: 6px 10px 12px; 
    }
    .input-area input {
      padding: 8px 12px;
      font-size: 13px;
    }
    .send-btn {
      width: 38px;
      height: 38px;
    }
    .privacy-footer {
      padding: 4px 12px 8px;
    }
    .privacy-footer p {
      font-size: 9px;
      line-height: 1.3;
    }
  }

  .chat-header {
    padding: 20px 24px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .bot-avatar {
    width: 48px;
    height: 48px;
    border-radius: 16px;
    background: linear-gradient(135deg, #2563eb, #0891b2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }

  .bot-avatar::after {
    content: '';
    position: absolute;
    bottom: -2px; right: -2px;
    width: 11px; height: 11px;
    background: var(--accent);
    border-radius: 50%;
    border: 2px solid #fff;
  }

  .header-info {
    flex: 1;
    min-width: 0;
  }

  .header-info h1 {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .header-info span {
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }

  .progress-bar-wrap {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .progress-label {
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
  }

  .progress-track {
    width: 80px;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #14b8a6, #0e7490);
    border-radius: 99px;
    transition: width 0.5s ease;
    width: 0%;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  .bubble {
    max-width: 85%;
    padding: 12px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    animation: bubbleIn 0.25s ease;
    white-space: pre-wrap;
    word-break: break-word;
  }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble.bot {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    align-self: flex-start;
    color: var(--text);
  }

  .bubble.user {
    background: var(--user-bubble);
    border: 1px solid rgba(15,118,110,0.18);
    border-bottom-right-radius: 4px;
    align-self: flex-end;
    color: var(--text);
  }

  .bubble.bot strong {
    color: var(--accent);
    font-weight: 600;
  }

  .typing-indicator {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 14px 15px;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    align-self: flex-start;
    animation: bubbleIn 0.25s ease;
  }

  .typing-indicator span {
    width: 7px; height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  @keyframes slideInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .buttons-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-self: flex-start;
    max-width: 90%;
    animation: slideInUp 0.4s ease forwards;
  }

  .choice-btn {
    padding: 9px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }

  .choice-btn:hover {
    background: var(--accent);
    color: #fff;
    transform: translateY(-1px);
  }

  .choice-btn:active {
    transform: translateY(0);
  }

  .summary-card {
    background: linear-gradient(135deg, rgba(20,184,166,0.08), rgba(14,116,144,0.06));
    border: 1px solid rgba(15,118,110,0.2);
    border-radius: 14px;
    padding: 16px;
    align-self: flex-start;
    max-width: 90%;
    animation: bubbleIn 0.3s ease;
  }

  .summary-card h3 {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(15,81,70,0.08);
    font-size: 13.5px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .label { color: var(--text-muted); }
  .summary-row .value { font-weight: 600; color: var(--text); font-family: 'Space Mono', monospace; font-size: 13px; }
  .summary-row .value.green { color: var(--accent); }
  .summary-row .value.blue { color: var(--accent2); }

  .input-area {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface2);
    flex-shrink: 0;
  }

  .input-area input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 15px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .input-area input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15,118,110,0.12);
  }

  .input-area input::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #14b8a6, #0e7490);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
    flex-shrink: 0;
  }

  .send-btn:hover { transform: scale(1.06); }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .send-btn svg { width: 18px; height: 18px; fill: #fff; }

  .restart-btn {
    position: absolute;
    top: 18px; right: 70px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Space Mono', monospace;
  }
  .restart-btn:hover { border-color: var(--accent); color: var(--accent); }

  .privacy-footer {
    padding: 11px 16px 13px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    flex-shrink: 0;
  }
  .privacy-footer p {
    font-size: 11px;
    line-height: 1.55;
    color: var(--text-muted);
    text-align: center;
    max-width: 100%;
  }
  .privacy-footer strong {
    color: var(--text);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="chat-wrapper">
  <div class="chat-header">
    <div class="bot-avatar">💼</div>
    <div class="header-info">
      <h1>FinBot</h1>
      <span>● online · Οικονομικός Σύμβουλος</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-label" id="stepLabel">0/6</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Γράψε εδώ..." autocomplete="off" inputmode="decimal" />
    <button class="send-btn" id="sendBtn" onclick="handleSend()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>

  <div class="privacy-footer">
    <p>Τα δεδομένα είναι <strong>ανώνυμα</strong>: δεν συλλέγουμε όνομα, email ή στοιχεία ταυτοποίησης. Χρησιμοποιούνται μόνο οι απαντήσεις σου για στατιστική ανάλυση της μελέτης.</p>
  </div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
const state = {
  step: 'intro',
  condition: 0,
  error_timing: null,
  show_conf: false,
  income: 0,
  limit: 0,
  rent: 0,
  hasRent: null,
  ejoda: 0,
  entertainment: 0,
  total_expenses: 0,
  disposable: 0,
  savings_goal: 0,
  emergency_low: 0,
  emergency_high: 0,
  has_savings: null,
  current_savings: 0,
  monthly_savings: 0,
  correct_months: 0,
};

const TOTAL_STEPS = 6;
let currentStepNum = 0;
let waitingForInput = false;
let inputResolver = null;

/**
 * Google Apps Script Web App URL
 * Εδώ θα βάλεις το URL που θα πάρεις από το Google Apps Script.
 */
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycby0f2Oxz9LkXYdyYjlu3NdhB1zl8xM4ObxQEQrHeclzPNjBqc73_sxERz1s-A7kPLz8/exec';

/*
  Αποθήκευση: (α) localStorage · (β) αν WEBHOOK_URL ≠ '', απευθείας στο Google Sheet.
*/

const RESPONSE_LOG_KEY = 'finbot_user_responses_v1';
const MAX_LOG_ENTRIES = 2500;
let responseSessionId = null;

function pushEntryToServer(entry) {
  const url = (WEBHOOK_URL || '').trim();
  if (!url) return;
  fetch(url, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      sessionId: entry.sessionId,
      condition: entry.experimental_condition ?? entry.condition ?? null,
      error_timing: entry.error_timing ?? null,
      show_conf: !!entry.show_conf,
      category: entry.category ?? '',
      field: entry.field ?? '',
      value: entry.value === undefined ? null : entry.value,
      detail: entry.detail === undefined ? null : entry.detail,
    }),
  }).catch(() => {});
}

function loadResponseLog() {
  try {
    const raw = localStorage.getItem(RESPONSE_LOG_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (_) {
    return [];
  }
}

function saveResponseLog(entries) {
  try {
    localStorage.setItem(RESPONSE_LOG_KEY, JSON.stringify(entries));
  } catch (e) {
    console.warn('FinBot: αποθήκευση απαντήσεων απέτυχε', e);
  }
}

function appendResponseEntry({ category, field, value, detail }) {
  if (!responseSessionId) return;
  
  const interaction_metrics = metrics.getStats();
  
  const entry = {
    sessionId: responseSessionId,
    ts: new Date().toISOString(),
    experimental_condition: state.condition,
    error_timing: state.error_timing,
    show_conf: state.show_conf,
    category,
    field,
    value: value === undefined ? null : value,
    detail: { 
      ...(detail || {}),
      interaction_metrics 
    },
  };
  const log = loadResponseLog();
  log.push(entry);
  if (log.length > MAX_LOG_ENTRIES) log.splice(0, log.length - MAX_LOG_ENTRIES);
  saveResponseLog(log);
  pushEntryToServer(entry);
}

function beginResponseSession() {
  responseSessionId = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
  appendResponseEntry({
    category: 'session',
    field: 'started',
    value: responseSessionId,
    detail: { ua: typeof navigator !== 'undefined' ? navigator.userAgent : '' },
  });
}

// ============================================================
// UI HELPERS
// ============================================================
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBubble(text, who) {
  const div = document.createElement('div');
  div.className = `bubble ${who}`;
  // Μετατροπή των **text** σε <strong>text</strong> για σωστό bold
  const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  div.innerHTML = formattedText;
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typing';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function botSay(text, delay = 800) {
  showTyping();
  await sleep(delay);
  removeTyping();
  addBubble(text, 'bot');
}

function showButtons(options) {
  metrics.recordFirstAction(); // Button row counts as action potential
  const row = document.createElement('div');
  row.className = 'buttons-row';
  row.id = 'btnRow';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt.label;
    btn.onclick = () => {
      metrics.recordFirstAction();
      row.remove();
      addBubble(opt.label, 'user');
      if (inputResolver) {
        inputResolver(opt.value !== undefined ? opt.value : opt.label);
        inputResolver = null;
      }
    };
    row.appendChild(btn);
  });
  messagesEl.appendChild(row);
  scrollBottom();
}

function showSummary(data) {
  const card = document.createElement('div');
  card.className = 'summary-card';
  const confRow = data.show_conf
    ? `<div class="summary-row"><span class="label">📈 Επίπεδο εμπιστοσύνης</span><span class="value">98%</span></div>`
    : '';
  card.innerHTML = `
    <h3>📊 Το Πλάνο Σου</h3>
    <div class="summary-row"><span class="label">💰 Μηνιαίο εισόδημα</span><span class="value">${data.income}€</span></div>
    <div class="summary-row"><span class="label">🏠 Σταθερά έξοδα</span><span class="value">${data.total_expenses}€</span></div>
    <div class="summary-row"><span class="label">💵 Ελεύθερα χρήματα</span><span class="value green">${data.disposable}€</span></div>
    <div class="summary-row"><span class="label">🎯 Μηνιαία αποταμίευση</span><span class="value blue">${data.monthly_savings}€/μήνα</span></div>
    <div class="summary-row"><span class="label">⏱️ Χρόνος για στόχο</span><span class="value">${data.correct_months} μήνες</span></div>
    ${confRow}
  `;
  messagesEl.appendChild(card);
  scrollBottom();
}

function updateProgress(step, total) {
  const pct = Math.round((step / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepLabel').textContent = `${step}/${total}`;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function confidenceSuffix(percent) {
  return state.show_conf ? `\n\n**Confidence ${percent}%**` : '';
}

function assignExperimentalCondition() {
  const STORAGE_KEY = 'finbot_last_condition';
  let last = 0;
  try {
    const s = sessionStorage.getItem(STORAGE_KEY);
    if (s != null && s !== '') last = parseInt(s, 10) || 0;
  } catch (_) {}

  let random = Math.floor(Math.random() * 6) + 1;
  let guard = 0;
  while (random === last && last >= 1 && last <= 6 && guard++ < 40) {
    random = Math.floor(Math.random() * 6) + 1;
  }
  try {
    sessionStorage.setItem(STORAGE_KEY, String(random));
  } catch (_) {}

  state.condition = random;
  if (random === 1) { state.error_timing = 'early'; state.show_conf = true; }
  if (random === 2) { state.error_timing = 'early'; state.show_conf = false; }
  if (random === 3) { state.error_timing = 'late'; state.show_conf = true; }
  if (random === 4) { state.error_timing = 'late'; state.show_conf = false; }
  if (random === 5) { state.error_timing = 'none'; state.show_conf = true; }
  if (random === 6) { state.error_timing = 'none'; state.show_conf = false; }
}

// ============================================================
// METRICS TRACKER
// ============================================================
const metrics = {
  stepStartTime: 0,
  firstActionTime: 0,
  editCount: 0,
  reset(startTime = Date.now()) {
    this.stepStartTime = startTime;
    this.firstActionTime = 0;
    this.editCount = 0;
  },
  recordFirstAction() {
    if (this.firstActionTime === 0) {
      this.firstActionTime = Date.now();
    }
  },
  getStats() {
    const end = Date.now();
    return {
      hesitation_ms: this.firstActionTime > 0 ? this.firstActionTime - this.stepStartTime : end - this.stepStartTime,
      total_time_ms: end - this.stepStartTime,
      edits: this.editCount
    };
  }
};

inputEl.addEventListener('input', () => {
  metrics.recordFirstAction();
});

// ============================================================
// INPUT HANDLING
// ============================================================
function waitForInput() {
  waitingForInput = true;
  inputEl.disabled = false;
  sendBtn.disabled = false;
  inputEl.focus();
  metrics.reset(); // Reset for new step
  return new Promise(resolve => { inputResolver = resolve; });
}

async function handleSend() {
  if (!waitingForInput || !inputResolver) return;
  const val = inputEl.value.trim();
  if (!val) return;
  inputEl.value = '';
  inputEl.disabled = true;
  sendBtn.disabled = true;
  waitingForInput = false;
  addBubble(val, 'user');
  inputResolver(val);
  inputResolver = null;
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Backspace' || e.key === 'Delete') {
    metrics.editCount++;
  }
  if (e.key === 'Enter') handleSend();
});

// ============================================================
// FLOW
// ============================================================
function parseNumericInput(raw) {
  if (!raw) return NaN;
  let s = raw.trim();
  
  // If there are both dots and commas (e.g., 1.234,56)
  if (s.includes('.') && s.includes(',')) {
    // Standard Greek/European format: dot for thousands, comma for decimal
    return parseFloat(s.replace(/\./g, '').replace(',', '.'));
  }
  
  // If there's only a comma (e.g., 3,5 or 1000,50)
  if (s.includes(',')) {
    return parseFloat(s.replace(',', '.'));
  }
  
  // If there's only one or more dots
  if (s.includes('.')) {
    const parts = s.split('.');
    // If multiple dots (e.g., 1.000.000), they are thousands separators
    if (parts.length > 2) {
      return parseFloat(s.replace(/\./g, ''));
    }
    // Single dot (e.g., 3.000 vs 3.5)
    // If it's followed by exactly 3 digits, assume thousands separator
    if (parts[1].length === 3) {
      return parseFloat(s.replace('.', ''));
    }
    // Otherwise treat as decimal (e.g., 3.5, 10.50)
    return parseFloat(s);
  }
  
  return parseFloat(s);
}

async function getNumber(fallback = 0) {
  const raw = await waitForInput();
  const n = parseNumericInput(raw);
  return isNaN(n) ? fallback : n;
}

async function getNumberLogged(category, field, fallback = 0) {
  const raw = await waitForInput();
  const n = parseNumericInput(raw);
  const val = isNaN(n) ? fallback : n;
  appendResponseEntry({ category, field, value: val, detail: { raw_input: raw } });
  return val;
}

async function runFlow() {
  assignExperimentalCondition();
  beginResponseSession();
  inputEl.disabled = true;
  sendBtn.disabled = true;

  // ---- INTRO ----
  await botSay('Γεια σου! Είμαι ο FinBot 💼\n\nΘα σε βοηθήσω να δημιουργήσεις ένα απλό οικονομικό πλάνο, βήμα-βήμα.\n\nΣτόχος είναι να οργανώσουμε βασικές πληροφορίες και να δούμε πώς διαμορφώνονται τα οικονομικά σου.\n\n**Σημαντικό:** Δεν χρειάζεται να χρησιμοποιήσεις πραγματικά σου δεδομένα αν δεν το επιθυμείς. Μπορείς να βάλεις ενδεικτικά ή υποθετικά νούμερα για να δεις πώς λειτουργεί το εργαλείο.', 2000);

  await sleep(400);
  showButtons([{ label: 'Πάμε 🚀', value: 'start' }]);
  await new Promise(res => { inputResolver = res; });
  appendResponseEntry({ category: 'intro', field: 'lets_go', value: 'start' });
  updateProgress(1, TOTAL_STEPS);

  // ---- STEP 1: INCOME ----
  await botSay('Για να ξεκινήσουμε, ας πάρουμε μια βασική εκτίμηση 🙂\n\nΠοιο είναι το μηνιαίο καθαρό εισόδημά σου (ή μια ρεαλιστική εκτίμηση);', 1000);

  let incomeOk = false;
  while (!incomeOk) {
    state.income = await getNumberLogged('income', 'monthly_net_eur');
    if (state.income > 0) {
      incomeOk = true;
    } else {
      await botSay('Παρακαλώ γράψε έναν αριθμό σε ευρώ, π.χ. **900**', 500);
    }
  }

  {
    const correct40 = Math.round(state.income * 0.40);
    if (state.error_timing === 'early') {
      // Σημαντικό λάθος: Το bot λέει ότι το 40% είναι το 75% του μισθού
      state.limit = Math.round(state.income * 0.75);
    } else {
      state.limit = correct40;
    }
  }
  updateProgress(2, TOTAL_STEPS);

  // ---- STEP 2: RENT ----
  await botSay(`Με βάση το εισόδημά σου, τα σταθερά έξοδα συνήθως υπολογίζεται ότι δεν ξεπερνούν περίπου το 40% του μηνιαίου ποσού.\r\n\r\nΑυτό σημαίνει έως **${state.limit} €** τον μήνα.\r\n\r\nΠληρώνεις ενοίκιο; ` + confidenceSuffix(95), 1200);

  showButtons([
    { label: 'Ναι', value: 'yes' },
    { label: 'Όχι', value: 'no' }
  ]);
  const rentAnswer = await new Promise(res => { inputResolver = res; });
  appendResponseEntry({ category: 'fixed_costs', field: 'has_rent', value: rentAnswer });

  if (rentAnswer === 'yes' || rentAnswer.toLowerCase().startsWith('ν')) {
    await botSay('Πόσο είναι το μηνιαίο ενοίκιο σου; (σε €)', 700);
    state.rent = await getNumberLogged('fixed_costs', 'rent_amount_eur');
    
    // --- VALUE ADD: BENCHMARKING ---
    const ratio = (state.rent / state.income) * 100;
    if (ratio <= 35) {
      await botSay('Πολύ καλά! Το ενοίκιό σου είναι σε ιδανικό επίπεδο σε σχέση με το εισόδημά σου (κάτω από **35%**).', 800);
    } else if (ratio <= 45) {
      await botSay('Το ενοίκιό σου είναι σε λογικά πλαίσια, αν και οριακά κοντά στον μέσο όρο.', 800);
    } else {
      await botSay('Σημείωση: Το ενοίκιο αυτό απορροφά μεγάλο μέρος του εισοδήματός σου. Θα το λάβω υπόψη.', 800);
    }
    
    await botSay(`Οκ, το σημειώνω 👍\n\nΘα το λάβω υπόψη στο πλάνο σου.`, 600);
  } else {
    state.rent = 0;
    await botSay('Mπράβο που δεν έχεις ενοίκιο!! Αυτό είναι τεράστιο πλεονέκτημα για την αποταμίευσή σου. 🚀', 800);
  }

  await botSay('Ωραία, ας δούμε και τα υπόλοιπα μηνιαία σου έξοδα 🙂\n\nΓια παράδειγμα:\n• Συνδρομές (Netflix, Spotify κλπ.)\n• Λογαριασμοί (ρεύμα, κινητό κλπ.)\n• Μετακίνηση για δουλειά\n• Διασκέδαση & βόλτες\n\nΠερίπου πόσο είναι συνολικά αυτά τον μήνα; (σε €)', 1000);

  state.ejoda = await getNumberLogged('variable_expenses', 'other_monthly_eur');
  state.total_expenses = state.rent + state.ejoda;
  state.disposable = state.income - state.total_expenses;

  updateProgress(3, TOTAL_STEPS);

  // ---- STEP 3: GOAL ----
  await botSay(`Ωραία — άρα τα συνολικά μηνιαία σου έξοδα είναι περίπου **${state.total_expenses} €**.\n\nΑυτό σημαίνει ότι σου μένουν περίπου **${state.disposable} €** κάθε μήνα.\n\nΠάμε στο επόμενο βήμα 🙂\nΈχεις κάποιον οικονομικό στόχο για τους επόμενους **12** μήνες;\nΠόσα θα ήθελες να έχεις αποταμιεύσει; (σε €)` + confidenceSuffix(94), 1200);

  state.savings_goal = await getNumberLogged('goals', 'savings_target_12m_eur');
  updateProgress(4, TOTAL_STEPS);

  state.emergency_low = Math.round(state.income * 2);
  state.emergency_high = Math.round(state.income * 3);

  // ---- STEP 4: EMERGENCY FUND ----
  await botSay(`Πριν συνεχίσουμε, υπάρχει κάτι που πολλοί νέοι συχνά παραλείπουν: το έκτακτο ταμείο 🙂\n\nΣυνήθως προτείνεται να καλύπτει **2–3** μηνιαία εισοδήματα — για σένα αυτό αντιστοιχεί περίπου σε **${state.emergency_low}€** έως **${state.emergency_high}€**.\n\nΈχεις ήδη κάποιες αποταμιεύσεις;` + confidenceSuffix(95), 1200);

  showButtons([
    { label: 'Ναι, έχω 🙂', value: 'yes' },
    { label: 'Όχι ακόμα', value: 'no' }
  ]);
  const hasSavings = await new Promise(res => { inputResolver = res; });
  appendResponseEntry({ category: 'emergency_fund', field: 'has_existing_savings', value: hasSavings });

  if (hasSavings === 'yes') {
    await botSay('Τέλεια 🙂\nΠόσα περίπου χρήματα έχεις στην άκρη αυτή τη στιγμή;', 800);
    state.current_savings = await getNumberLogged('emergency_fund', 'current_savings_eur');
    await botSay(`Οκ, το σημειώνω 🙂\nΠάμε παρακάτω.`, 700);
  } else {
    await botSay('Οκ, το σημειώνω 🙂\nΠάμε παρακάτω.', 800);
  }

  // ---- STEP 5: MONTHLY SAVINGS ----
  updateProgress(5, TOTAL_STEPS);
  await botSay(`Ένας τρόπος που χρησιμοποιούν πολλοί είναι να ρυθμίζουν αυτόματη μεταφορά αποταμίευσης την ίδια μέρα που μπαίνει ο μισθός τους 🙂\n\nΠόσο θα μπορούσες να αποταμιεύεις άνετα κάθε μήνα; (σε €)`, 1000);

  showButtons([
    { label: '50€', value: 50 },
    { label: '100€', value: 100 },
    { label: '150€', value: 150 },
    { label: '200€', value: 200 },
    { label: '250€', value: 250 },
    { label: '300€', value: 300 },
    { label: 'Other', value: 'other' }
  ]);

  let monthlySavingsRaw = await new Promise(res => { inputResolver = res; });
  appendResponseEntry({
    category: 'savings_plan',
    field: 'monthly_commitment_choice',
    value: monthlySavingsRaw,
    detail: { preset_or_other: monthlySavingsRaw === 'other' ? 'other' : 'preset' },
  });

  if (monthlySavingsRaw === 'other') {
    await botSay('Οκ 🙂 γράψε περίπου πόσα θα μπορούσες να αποταμιεύεις κάθε μήνα', 700);
    state.monthly_savings = await getNumberLogged('savings_plan', 'monthly_commitment_custom_eur');
  } else {
    state.monthly_savings = parseFloat(monthlySavingsRaw) || 100;
  }

  {
    const actualMonths = Math.ceil(state.savings_goal / state.monthly_savings);
    if (state.error_timing === 'late') {
      // Σημαντικό λάθος: Το bot υποτιμά τον χρόνο (π.χ. λέει 4 μήνες αντί για 12)
      state.correct_months = Math.max(1, Math.floor(actualMonths / 3));
    } else {
      state.correct_months = actualMonths;
    }
  }
  updateProgress(6, TOTAL_STEPS);

  // ---- STEP 6: RESULT ----
  await botSay(`Ωραία 🙂\nΜε ${state.monthly_savings}€ τον μήνα, για να φτάσεις τα ${state.savings_goal}€ θα χρειαστούν περίπου **${state.correct_months} μήνες**.`, 1200);

  // --- VALUE ADD: WHAT-IF SCENARIO ---
  const extraAmount = 25;
  const fasterMonths = Math.ceil(state.savings_goal / (state.monthly_savings + extraAmount));
  const diff = state.correct_months - fasterMonths;
  if (diff > 0) {
    await sleep(600);
    await botSay(`💡 Μια μικρή συμβουλή: Αν αποταμίευες μόλις ${extraAmount}€ παραπάνω το μήνα, θα πετύχαινες το στόχο σου ${diff} ${diff === 1 ? 'μήνα' : 'μήνες'} νωρίτερα!`, 1500);
  }

  await sleep(400);

  appendResponseEntry({
    category: 'session',
    field: 'completed_summary',
    value: 'done',
    detail: {
      income: state.income,
      limit_shown_eur: state.limit,
      rent_eur: state.rent,
      variable_other_eur: state.ejoda,
      total_expenses_eur: state.total_expenses,
      disposable_eur: state.disposable,
      savings_goal_eur: state.savings_goal,
      monthly_savings_eur: state.monthly_savings,
      months_shown: state.correct_months,
      current_savings_eur: state.current_savings,
    },
  });

  // ---- FINAL SUMMARY ----
  await botSay(`Ας δούμε μια σύνοψη του πλάνου σου:\n\n💰 Μηνιαίο εισόδημα: ${state.income}€\n🏠 Συνολικά έξοδα: ${state.total_expenses}€\n💵 Διαθέσιμα χρήματα: ${state.disposable}€\n🎯 Μηνιαία αποταμίευση: ${state.monthly_savings}€\n\nΠώς σου φαίνεται αυτό το πλάνο?\n(1 = καθόλου ικανοποιητικό, 10 = εξαιρετικό)`, 1500);

  const ratingOptions = [];
  for (let i = 1; i <= 10; i++) {
    ratingOptions.push({ label: String(i), value: i });
  }
  showButtons(ratingOptions);

  const planRating = await new Promise(res => { inputResolver = res; });
  appendResponseEntry({
    category: 'session',
    field: 'plan_rating_1_10',
    value: planRating,
  });

  await botSay('Το πλάνο σου είναι έτοιμο 🙂\n\nΕυχαριστούμε για τη συμμετοχή σου!\nΘα ακολουθήσουν μερικές σύντομες ερωτήσεις για την εμπειρία σου.', 1200);

  await sleep(400);
  showButtons([{ label: 'Πάμε στις ερωτήσεις →', value: 'survey' }]);
  await new Promise(res => { inputResolver = res; });

  try {
    sessionStorage.setItem(
      'finbot_survey_context_v1',
      JSON.stringify({
        sessionId: responseSessionId,
        condition: state.condition,
        error_timing: state.error_timing,
        show_conf: state.show_conf,
      })
    );
  } catch (_) {}

  appendResponseEntry({
    category: 'session',
    field: 'navigate_to_survey',
    value: true,
    detail: { target: 'survey.html' },
  });
  window.location.href = 'survey.html';
}

// ============================================================
// INIT
// ============================================================
updateProgress(0, TOTAL_STEPS);
runFlow();
</script>
